body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:8px}
.month{flex:1;min-width:0}
.month h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.month .yr{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.nav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:18px}
.gear{height:40px;padding:0 14px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stat .val{font-family:var(--f-display);font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .val small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 6px 6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr) 40px;row-gap:2px}
.dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0 8px;letter-spacing:.04em}
.dow.we{color:var(--ink)}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border-radius:10px;min-width:0}
.day:active{background:var(--bg)}
.day.out{visibility:hidden}
.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.num.planned{box-shadow:inset 0 0 0 2.5px var(--plan)}
.num.done{color:#fff}
.num.part{box-shadow:inset 0 0 0 2.5px var(--plan)}
.day.past .num.planned{color:var(--muted)}
.day.today .num::after{content:"";position:absolute;bottom:-5px;width:14px;height:2px;border-radius:1px;background:var(--today)}
.dots{display:flex;gap:3px;height:6px}
.dots b{width:6px;height:6px;border-radius:50%;background:var(--plan)}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);border-left:1px solid var(--line);margin:4px 0}
.wk.full{color:var(--accent)}
.wk span{font-size:9px;letter-spacing:.06em;font-weight:600}

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend .ring{box-shadow:inset 0 0 0 2px var(--plan)}
.status{font-size:12px;color:var(--muted);text-align:center}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);max-height:86%;overflow:auto;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sh-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sh-head h2{font-family:var(--f-display);font-size:19px;font-weight:500;margin:0}
.close{font-size:14px;font-weight:700;color:var(--accent);padding:6px 0}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line)}
.row .chk{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.row .nm{flex:1;min-width:0;font-weight:600}
.row .sub{font-size:12px;color:var(--muted);font-weight:500}
.row .x{color:var(--muted);font-size:13px;font-weight:600;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:18px;border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%}
.chip.on{color:#fff;border-color:transparent}

.tpl{display:grid;grid-template-columns:34px 1fr;gap:10px 10px;align-items:start}
.tpl .d{font-weight:700;font-size:13px;padding-top:9px;color:var(--muted)}
.trow{display:flex;align-items:center;gap:8px}
.trow input{flex:1;min-width:0;font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.sw{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.btn{padding:12px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{background:var(--surface)}
.actions .btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.day .tick{width:5px;height:5px;border-radius:50%;background:var(--ink);position:absolute;top:2px;right:2px}
.addlog{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--bg)}
.addlog .line{display:flex;gap:8px}
.addlog input,.exrow input,.exrow select{flex:1;min-width:0;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.addlog .btn{flex:none;background:var(--accent);color:#fff;border-color:transparent}
.chip.sel{background:var(--ink);color:var(--bg);border-color:transparent}
.vals{font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .vl{fill:var(--ink);font-weight:700;font-size:12px}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .big{font-family:var(--f-display);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.hero .delta{font-weight:700;color:#1FA67A;font-size:14px}
.hero .from{color:var(--muted);font-size:13px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;align-self:flex-start}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.hist div span:first-child{color:var(--muted);font-weight:600;flex:none}
.hist div span:last-child{text-align:right;font-weight:600}
.exrow{display:flex;gap:8px;align-items:center}
.exrow select{flex:0 0 82px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <button class="nav" id="prev" aria-label="Предыдущий месяц">‹</button>
    <div class="month"><h1 id="mName">Ноябрь</h1><div class="yr" id="mYear">2026</div></div>
    <button class="nav" id="next" aria-label="Следующий месяц">›</button>
  </header>
  <div class="actions">
    <button class="btn" id="openPlan">План недели</button>
    <button class="btn dark" id="openProgress">Прогресс</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="lbl">Эта неделя</div><div class="val" id="sWeek">0 <small>из 0</small></div><div class="bar"><i id="bWeek"></i></div></div>
    <div class="stat"><div class="lbl" id="sMonthLbl">Месяц</div><div class="val" id="sMonth">0 <small>из 0</small></div><div class="bar"><i id="bMonth"></i></div></div>
  </div>

  <div class="cal"><div class="grid" id="grid"></div></div>

  <div class="legend" id="legend"></div>
  <div class="status" id="status">Данные хранятся на этом телефоне</div>
</div>

<div id="sheetHost"></div>

<script>
(function(){
const MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_G=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const DOW=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const DOW_FULL=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
const COLORS=["#2F6FEB","#E0533D","#1FA67A","#9B5DE5","#F2A007","#0FA3B1","#E5487F","#5B6B7F"];
const LS="trainingCalendar.v1";
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const wd=d=>(d.getDay()+6)%7+1; // 1=Mon..7=Sun
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date(); today.setHours(0,0,0,0);
const TODAY=ds(today);

function defaults(){
  const first=ds(new Date(today.getFullYear(),today.getMonth(),1));
  return {v:1,
    types:[{id:"str",name:"Силовая",color:COLORS[0]},{id:"cardio",name:"Кардио",color:COLORS[1]},{id:"yoga",name:"Растяжка",color:COLORS[2]}],
    templates:[{from:first,days:{1:["str"],3:["cardio"],5:["str"],6:["yoga"]}}],
    days:{}};
}
const UNITS=["сек","раз","кг","мин","км"];
function normalize(s){
  if(!s.days) s.days={};
  if(!s.logs) s.logs={};
  if(!s.exercises) s.exercises=[
    {id:"hang",name:"Вис на турнике",unit:"сек"},
    {id:"pull",name:"Подтягивания",unit:"раз"},
    {id:"neg",name:"Негативные подтягивания",unit:"раз"}];
  return s;
}
let state=null;
try{const raw=localStorage.getItem(LS); if(raw) state=JSON.parse(raw);}catch(e){}
if(!state||!state.types) state=defaults();
normalize(state);
const exById=id=>state.exercises.find(x=>x.id===id);
const logsFor=date=>(state.logs[date]||[]).filter(l=>exById(l.ex));
const fmtNum=n=>String(Math.round(n*100)/100).replace(".",",");
const shortDate=s=>{const d=parse(s);return d.getDate()+" "+MONTHS_G[d.getMonth()].slice(0,3)+".";};
let selEx=null, progEx=null, progMetric="best";

let view=new Date(today.getFullYear(),today.getMonth(),1);
let openDay=null, sheet=null;

const typeById=id=>state.types.find(t=>t.id===id);
function templateFor(date){
  let t=null; for(const x of state.templates){ if(x.from<=date && (!t||x.from>t.from)) t=x; }
  return t;
}
function planFor(date){
  const rec=state.days[date];
  if(rec&&rec.plan) return rec.plan.filter(typeById);
  const t=templateFor(date); if(!t) return [];
  return (t.days[wd(parse(date))]||[]).filter(typeById);
}
function doneFor(date){const r=state.days[date];return r&&r.done?r.done.filter(typeById):[];}
function counts(date){
  const p=planFor(date), d=doneFor(date);
  const all=[...new Set([...p,...d])];
  return {plan:all.length, done:d.length, items:all, doneSet:new Set(d)};
}

/* ---------- persistence (on this device) ---------- */
let saveTimer=null;
function setStatus(t){document.getElementById("status").textContent=t;}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));return true;}catch(e){return false;}}
function changed(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{setStatus(saveLocal()?"Сохранено на этом телефоне":"Не удалось сохранить: браузер запретил хранение данных");},300);}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function exportBackup(){
  const data=JSON.stringify(state,null,1), name="trenirovki-"+TODAY+".json";
  const file=new File([data],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Копия календаря тренировок"}).catch(()=>{});return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importBackup(file,btn){
  const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||!Array.isArray(s.types)||!Array.isArray(s.templates))throw 0;
      state=normalize(s);saveLocal();render();openPlanSheet(true);setStatus("Копия восстановлена");}
    catch(e){btn.textContent="Это не файл копии календаря";}};
  r.readAsText(file);
}

/* ---------- render ---------- */
function render(){
  const y=view.getFullYear(), m=view.getMonth();
  document.getElementById("mName").textContent=MONTHS[m];
  document.getElementById("mYear").textContent=y;
  document.getElementById("sMonthLbl").textContent=MONTHS[m];
  const first=new Date(y,m,1), lead=wd(first)-1, dim=new Date(y,m+1,0).getDate();
  const weeks=Math.ceil((lead+dim)/7);
  let h=DOW.map((d,i)=>`<div class="dow${i>4?" we":""}">${d}</div>`).join("")+`<div class="dow">нед</div>`;
  let mP=0,mD=0;
  for(let w=0;w<weeks;w++){
    let wP=0,wD=0;
    for(let i=0;i<7;i++){
      const n=w*7+i-lead+1;
      if(n<1||n>dim){h+=`<div class="day out"></div>`;continue;}
      const date=ds(new Date(y,m,n)), c=counts(date);
      wP+=c.plan; wD+=c.done;
      let cls="num", style="";
      const firstDone=c.items.find(id=>c.doneSet.has(id));
      if(firstDone){cls+=" done";style=`background:${typeById(firstDone).color}`;}
      else if(c.plan) cls+=" planned";
      let dots="";
      if(c.items.length>1) dots=c.items.map(id=>`<b style="${c.doneSet.has(id)?"background:"+typeById(id).color:""}"></b>`).join("");
      const label=`${n} ${MONTHS_G[m]}: ${c.plan?`запланировано ${c.plan}, сделано ${c.done}`:"нет тренировок"}`;
      h+=`<button class="day${date===TODAY?" today":""}${date<TODAY?" past":""}" data-d="${date}" aria-label="${label}"><span class="${cls}" style="${style}">${n}${logsFor(date).length?'<i class="tick" aria-hidden="true"></i>':""}</span><span class="dots">${dots}</span></button>`;
    }
    mP+=wP; mD+=wD;
    h+=`<div class="wk${wP&&wD>=wP?" full":""}">${wP?wD+"/"+wP:"—"}</div>`;
  }
  const g=document.getElementById("grid"); g.innerHTML=h;
  g.querySelectorAll(".day[data-d]").forEach(b=>b.onclick=()=>openDaySheet(b.dataset.d));
  // current week
  const mon=new Date(today); mon.setDate(today.getDate()-wd(today)+1);
  let cP=0,cD=0; for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const c=counts(ds(d));cP+=c.plan;cD+=c.done;}
  setStat("sWeek","bWeek",cD,cP); setStat("sMonth","bMonth",mD,mP);
  document.getElementById("legend").innerHTML=
    `<span><i class="ring"></i>запланировано</span><span><i style="width:6px;height:6px;background:var(--ink)"></i>есть результаты</span>`+
    state.types.map(t=>`<span><i style="background:${t.color}"></i>${esc(t.name)}</span>`).join("");
}
function setStat(id,bar,d,p){
  document.getElementById(id).innerHTML=`${d} <small>из ${p}</small>`;
  document.getElementById(bar).style.width=(p?Math.min(100,d/p*100):0)+"%";
}

/* ---------- sheets ---------- */
function closeSheet(){document.getElementById("sheetHost").innerHTML="";sheet=null;openDay=null;}
function showSheet(html){
  const host=document.getElementById("sheetHost");
  host.innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog"><div class="in"><div class="grab"></div>${html}</div></div>`;
  document.getElementById("scrim").onclick=closeSheet;
  host.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
}
function reopen(){ if(sheet==="day"&&openDay) openDaySheet(openDay,true); else if(sheet==="plan") openPlanSheet(true); else if(sheet==="progress") openProgressSheet(); }

function freeze(date){
  const r=state.days[date]||(state.days[date]={});
  if(!r.plan) r.plan=planFor(date).slice();
  if(!r.done) r.done=[];
  return r;
}
function openDaySheet(date,keep){
  sheet="day"; openDay=date;
  const d=parse(date), c=counts(date);
  const title=`${d.getDate()} ${MONTHS_G[d.getMonth()]}, ${DOW_FULL[wd(d)-1]}`;
  let rows=c.items.map(id=>{const t=typeById(id),on=c.doneSet.has(id);
    return `<div class="row"><button class="chk" data-t="${id}" aria-label="${on?"Снять отметку":"Отметить сделанной"}" style="${on?"background:"+t.color:"box-shadow:inset 0 0 0 2.5px var(--plan)"}">${on?"✓":""}</button>
      <div class="nm">${esc(t.name)}<div class="sub">${on?"сделано":(date<TODAY?"пропущено":"запланировано")}</div></div>
      <button class="x" data-rm="${id}">Убрать</button></div>`;}).join("");
  if(!rows) rows=`<div class="empty">На этот день ничего не запланировано.</div>`;
  const add=state.types.filter(t=>!c.items.includes(t.id)).map(t=>`<button class="chip" data-add="${t.id}"><i style="background:${t.color}"></i>${esc(t.name)}</button>`).join("");
  showSheet(`<div class="sh-head"><h2>${title}</h2><button class="close" data-close>Готово</button></div>
    <div class="sec">Тренировки · нажмите кружок, чтобы отметить</div>${rows}
    ${add?`<div class="sec">Добавить на этот день</div><div class="chips">${add}</div>`:""}
    ${resultsHtml(date)}`);
  const host=document.getElementById("sheetHost");
  bindResults(date);
  host.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const r=freeze(date),id=b.dataset.t;
    r.done=r.done.includes(id)?r.done.filter(x=>x!==id):[...r.done,id]; changed(); render(); openDaySheet(date,true);});
  host.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const r=freeze(date),id=b.dataset.rm;
    r.plan=r.plan.filter(x=>x!==id); r.done=r.done.filter(x=>x!==id); changed(); render(); openDaySheet(date,true);});
  host.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const r=freeze(date);
    r.plan.push(b.dataset.add); changed(); render(); openDaySheet(date,true);});
}

/* ---------- results (progress log) ---------- */
let draftSets="";
function parseSets(s){return s.split(/[\s,;\/]+/).map(x=>x.replace(",",".")).filter(Boolean).map(Number).filter(n=>isFinite(n)&&n>0);}
function resultsHtml(date){
  if(!selEx||!exById(selEx)) selEx=state.exercises[0]?state.exercises[0].id:null;
  const list=logsFor(date).map((l,i)=>{const ex=exById(l.ex);
    return `<div class="row"><div class="nm">${esc(ex.name)}<div class="sub vals">${l.sets.map(fmtNum).join(" · ")} ${esc(ex.unit)}${l.sets.length>1?` · ${l.sets.length} подх.`:""}</div></div><button class="x" data-dl="${i}">Удалить</button></div>`;}).join("");
  const chips=state.exercises.map(x=>`<button class="chip${x.id===selEx?" sel":""}" data-sx="${x.id}">${esc(x.name)}</button>`).join("");
  const ex=exById(selEx);
  return `<div class="sec">Результаты</div>${list}
    ${state.exercises.length?`<div class="addlog">
      <div class="chips">${chips}</div>
      <div class="line"><input id="setsIn" inputmode="decimal" autocomplete="off" placeholder="Подходы: 10 15 12" value="${esc(draftSets)}" aria-label="Результат по подходам${ex?", "+ex.unit:""}"><button class="btn" id="logBtn">Записать</button></div>
      <div class="note">${ex?`В ${esc(ex.unit)}. `:""}Каждый подход через пробел. Один подход — одно число.</div>
    </div>`:`<div class="empty">Добавьте упражнения в разделе «Прогресс».</div>`}`;
}
function bindResults(date){
  const host=document.getElementById("sheetHost");
  host.querySelectorAll("[data-sx]").forEach(b=>b.onclick=()=>{selEx=b.dataset.sx;openDaySheet(date,true);});
  const inp=document.getElementById("setsIn");
  if(inp){inp.oninput=()=>{draftSets=inp.value;};
    inp.onkeydown=e=>{if(e.key==="Enter")document.getElementById("logBtn").click();};}
  const btn=document.getElementById("logBtn");
  if(btn) btn.onclick=()=>{const sets=parseSets(inp.value);
    if(!sets.length){inp.focus();inp.placeholder="Введите хотя бы одно число";return;}
    (state.logs[date]||(state.logs[date]=[])).push({ex:selEx,sets});
    draftSets=""; changed(); render(); openDaySheet(date,true);};
  host.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Точно?";b.style.color="#E0533D";return;}
    const visible=logsFor(date), target=visible[+b.dataset.dl];
    state.logs[date]=(state.logs[date]||[]).filter(l=>l!==target);
    if(!state.logs[date].length) delete state.logs[date];
    changed(); render(); openDaySheet(date,true);});
}

function seriesFor(exId){
  return Object.keys(state.logs).sort().map(date=>{
    const sets=state.logs[date].filter(l=>l.ex===exId).flatMap(l=>l.sets);
    if(!sets.length) return null;
    return {date,sets,best:Math.max(...sets),sum:sets.reduce((a,b)=>a+b,0)};
  }).filter(Boolean);
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function chartSvg(pts,unit){
  const W=340,H=190,L=34,R=14,T=22,B=26,iw=W-L-R,ih=H-T-B;
  const max=niceMax(Math.max(...pts.map(p=>p.v))*1.1);
  const t0=parse(pts[0].date).getTime(), t1=parse(pts[pts.length-1].date).getTime(), span=Math.max(1,t1-t0);
  const X=p=>pts.length===1?L+iw/2:L+(parse(p.date).getTime()-t0)/span*iw;
  const Y=v=>T+ih-(v/max)*ih;
  let g="";
  [0,max/2,max].forEach(v=>{g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtNum(v)}</text>`;});
  const line=pts.map((p,i)=>(i?"L":"M")+X(p).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=pts.length>1?`<path class="ar" d="${line} L${X(pts[pts.length-1]).toFixed(1)} ${Y(0)} L${X(pts[0]).toFixed(1)} ${Y(0)} Z"/>`:"";
  const dots=pts.map((p,i)=>`<circle class="pt${i===pts.length-1?" last":""}" cx="${X(p).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===pts.length-1?5:3.5}"/>`).join("");
  const lp=pts[pts.length-1], lx=X(lp);
  const anchor=lx>W-R-30?"end":lx<L+30?"start":"middle";
  const lbl=`<text class="vl" x="${lx.toFixed(1)}" y="${(Y(lp.v)-10).toFixed(1)}" text-anchor="${anchor}">${fmtNum(lp.v)} ${esc(unit)}</text>`;
  const xl=`<text x="${L}" y="${H-6}" text-anchor="start">${shortDate(pts[0].date)}</text>`+(pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${shortDate(lp.date)}</text>`:"");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График прогресса">${g}${area}<path class="ln" d="${line}"/>${dots}${lbl}${xl}</svg>`;
}
function openProgressSheet(){
  sheet="progress";
  if(!progEx||!exById(progEx)){
    const withData=state.exercises.find(x=>seriesFor(x.id).length);
    progEx=(withData||state.exercises[0]||{}).id||null;
  }
  const ex=exById(progEx);
  const chips=state.exercises.map(x=>`<button class="chip${x.id===progEx?" sel":""}" data-px="${x.id}">${esc(x.name)}</button>`).join("");
  let body="";
  if(ex){
    const s=seriesFor(ex.id);
    if(!s.length){
      body=`<div class="empty">Пока нет записей. Откройте день в календаре и внизу, в «Результатах», запишите подходы — здесь появится график.</div>`;
    }else{
      const pts=s.map(r=>({date:r.date,v:progMetric==="best"?r.best:r.sum}));
      const first=pts[0].v,last=pts[pts.length-1].v,d=last-first;
      body=`<div class="seg"><button data-m="best" class="${progMetric==="best"?"on":""}">Лучший подход</button><button data-m="sum" class="${progMetric==="sum"?"on":""}">Сумма за день</button></div>
        <div class="hero"><span class="big">${fmtNum(last)} ${esc(ex.unit)}</span>${pts.length>1?`<span class="delta" style="${d<0?"color:#E0533D":""}">${d>=0?"+":"−"}${fmtNum(Math.abs(d))}</span><span class="from">с ${fmtNum(first)} ${esc(ex.unit)} · ${shortDate(pts[0].date)}</span>`:`<span class="from">первая запись</span>`}</div>
        ${chartSvg(pts,ex.unit)}
        <div class="sec">История</div>
        <div class="hist">${s.slice().reverse().map(r=>`<div><span>${shortDate(r.date)}</span><span class="vals">${r.sets.map(fmtNum).join(" · ")} ${esc(ex.unit)}</span></div>`).join("")}</div>`;
    }
  }
  const exList=state.exercises.map(x=>`<div class="exrow"><input id="exn-${x.id}" data-exn="${x.id}" value="${esc(x.name)}" aria-label="Название упражнения">
      <select id="exu-${x.id}" data-exu="${x.id}" aria-label="Единица">${[...new Set([...UNITS,x.unit])].map(u=>`<option${u===x.unit?" selected":""}>${esc(u)}</option>`).join("")}</select>
      <button class="x" data-exd="${x.id}">Удалить</button></div>`).join("");
  showSheet(`<div class="sh-head"><h2>Прогресс</h2><button class="close" data-close>Готово</button></div>
    <div class="chips">${chips}</div>
    ${body}
    <div class="sec">Упражнения</div>
    ${exList}
    <button class="btn" id="addEx">+ Новое упражнение</button>`);
  const host=document.getElementById("sheetHost");
  host.querySelectorAll("[data-px]").forEach(b=>b.onclick=()=>{progEx=b.dataset.px;openProgressSheet();});
  host.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{progMetric=b.dataset.m;openProgressSheet();});
  host.querySelectorAll("[data-exn]").forEach(inp=>inp.onchange=()=>{const v=inp.value.trim();if(v){exById(inp.dataset.exn).name=v.slice(0,50);changed();openProgressSheet();}});
  host.querySelectorAll("[data-exu]").forEach(sel=>sel.onchange=()=>{exById(sel.dataset.exu).unit=sel.value;changed();openProgressSheet();});
  host.querySelectorAll("[data-exd]").forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Точно?";b.style.color="#E0533D";return;}
    const id=b.dataset.exd; state.exercises=state.exercises.filter(x=>x.id!==id);
    for(const k of Object.keys(state.logs)){state.logs[k]=state.logs[k].filter(l=>l.ex!==id);if(!state.logs[k].length)delete state.logs[k];}
    changed(); render(); openProgressSheet();});
  document.getElementById("addEx").onclick=()=>{const id="e"+Date.now().toString(36);
    state.exercises.push({id,name:"Новое упражнение",unit:"раз"}); progEx=id; changed(); openProgressSheet();
    const el=document.getElementById("exn-"+id); if(el){el.focus();el.select();}};
}

function editableTemplate(){
  // Editing applies from today; past days keep the plan they had.
  const hasHistory=Object.keys(state.days).length>0;
  if(!hasHistory){ const t=state.templates[state.templates.length-1]; state.templates=[t]; return t; }
  let t=templateFor(TODAY);
  if(t&&t.from===TODAY) return t;
  const copy={from:TODAY,days:JSON.parse(JSON.stringify(t?t.days:{}))};
  state.templates.push(copy); return copy;
}
function openPlanSheet(keep){
  sheet="plan";
  const t=templateFor(TODAY)||{days:{}};
  const tpl=DOW.map((d,i)=>{const sel=t.days[i+1]||[];
    return `<div class="d">${d}</div><div class="chips">${state.types.map(ty=>{const on=sel.includes(ty.id);
      return `<button class="chip${on?" on":""}" data-wd="${i+1}" data-ty="${ty.id}" style="${on?"background:"+ty.color:""}"><i style="background:${on?"#fff":ty.color}"></i>${esc(ty.name)}</button>`;}).join("")||'<span class="empty">Добавьте тип ниже</span>'}</div>`;}).join("");
  const types=state.types.map(ty=>`<div class="trow"><button class="sw" data-color="${ty.id}" style="background:${ty.color}" aria-label="Сменить цвет"></button>
      <input id="nm-${ty.id}" value="${esc(ty.name)}" data-name="${ty.id}" aria-label="Название"><button class="x" data-del="${ty.id}">Удалить</button></div>`).join("");
  showSheet(`<div class="sh-head"><h2>План по неделе</h2><button class="close" data-close>Готово</button></div>
    <div class="note">Отметьте, какие тренировки в какие дни недели. Изменения действуют с сегодняшнего дня, прошлые дни не меняются. Конкретный день можно поправить, нажав на него в календаре.</div>
    <div class="tpl">${tpl}</div>
    <div class="sec">Виды тренировок · нажмите кружок, чтобы сменить цвет</div>
    ${types}
    <button class="btn" id="addType">+ Новый вид тренировки</button>
    <div class="sec">Резервная копия</div>
    <div class="note">Все отметки хранятся только на этом телефоне. Иногда сохраняйте копию в файл (например, в «Файлы» или себе в Telegram), чтобы не потерять данные при смене телефона.</div>
    <div class="actions"><button class="btn" id="expBtn">Сохранить копию</button><label class="btn" style="text-align:center" id="impLbl">Восстановить<input type="file" id="impIn" accept="application/json,.json" hidden></label></div>`);
  document.getElementById("expBtn").onclick=exportBackup;
  document.getElementById("impIn").onchange=e=>{const f=e.target.files[0];if(f)importBackup(f,document.getElementById("impLbl"));};
  const host=document.getElementById("sheetHost");
  host.querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{const tt=editableTemplate(),k=b.dataset.wd,id=b.dataset.ty;
    const arr=tt.days[k]||[]; tt.days[k]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id]; changed(); render(); openPlanSheet(true);});
  host.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{const ty=typeById(b.dataset.color);
    ty.color=COLORS[(COLORS.indexOf(ty.color)+1)%COLORS.length]; changed(); render(); openPlanSheet(true);});
  host.querySelectorAll("[data-name]").forEach(inp=>inp.onchange=()=>{const ty=typeById(inp.dataset.name);
    const v=inp.value.trim(); if(v){ty.name=v.slice(0,40);changed();render();}});
  host.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){state.types=state.types.filter(x=>x.id!==b.dataset.del);changed();render();openPlanSheet(true);}
    else{b.dataset.armed="1";b.textContent="Точно?";b.style.color="#E0533D";}});
  document.getElementById("addType").onclick=()=>{const used=state.types.map(x=>x.color);
    state.types.push({id:"t"+Date.now().toString(36),name:"Новая тренировка",color:COLORS.find(c=>!used.includes(c))||COLORS[0]});
    changed(); render(); openPlanSheet(true);
    const inputs=host.querySelectorAll("[data-name]"); const last=inputs[inputs.length-1]; if(last){last.focus();last.select();}};
}

document.getElementById("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
document.getElementById("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
document.getElementById("openPlan").onclick=()=>openPlanSheet();
document.getElementById("openProgress").onclick=()=>openProgressSheet();
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
render();
setStatus("Данные хранятся на этом телефоне");
})();
</script>
